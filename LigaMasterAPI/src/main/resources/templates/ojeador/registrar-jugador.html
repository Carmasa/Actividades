<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Jugador - Ojeador</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }
        
        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        header h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }
        
        .content {
            padding: 30px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
        }
        
        input[type="text"],
        input[type="number"],
        select {
            width: 100%;
            padding: 10px;
            border: 2px solid #e9ecef;
            border-radius: 5px;
            font-size: 1em;
            transition: border-color 0.3s ease;
        }
        
        input[type="text"]:focus,
        input[type="number"]:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }
        
        button {
            flex: 1;
            padding: 12px 20px;
            font-size: 1em;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }
        
        .btn-registrar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-registrar:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-volver {
            background: #f0f0f0;
            color: #333;
            text-decoration: none;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .btn-volver:hover {
            background: #e0e0e0;
        }
        
        .mensaje {
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
        }
        
        .mensaje.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .mensaje.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            color: #666;
            border-top: 1px solid #e9ecef;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📝 Registrar Jugador</h1>
        </header>
        
        <div class="content">
            <div th:if="${mensaje}" class="mensaje success" th:text="${mensaje}"></div>
            <div th:if="${error}" class="mensaje error" th:text="${error}"></div>
            
            <form method="post" action="/ojeador/registrar-jugador">
                <div class="form-group">
                    <label for="nombre">Nombre del Jugador *</label>
                    <input type="text" id="nombre" name="nombre" required placeholder="Ej: Cristiano Ronaldo">
                </div>
                
                <div class="form-group">
                    <label for="posicion">Posición *</label>
                    <select id="posicion" name="posicion" required>
                        <option value="">Selecciona una posición</option>
                        <option th:each="pos : ${posiciones}" th:value="${pos}" th:text="${pos}"></option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="dorsal">Dorsal *</label>
                    <input type="number" id="dorsal" name="dorsal" required min="1" max="99" placeholder="Ej: 7">
                </div>
                
                <div class="form-group">
                    <label for="valorMercado">Valor de Mercado (€) *</label>
                    <input type="number" id="valorMercado" name="valorMercado" required min="0" step="0.01" placeholder="Ej: 100000000">
                </div>
                
                <div class="form-group">
                    <label for="equipoId">Equipo *</label>
                    <select id="equipoId" name="equipoId" required>
                        <option value="">Selecciona un equipo</option>
                        <option th:each="equipo : ${equipos}" th:value="${equipo.id}" th:text="${equipo.nombre}"></option>
                    </select>
                </div>
                
                <div class="buttons">
                    <button type="submit" class="btn-registrar">Registrar Jugador</button>
                    <a href="/ojeador/" class="btn-volver">Volver</a>
                </div>
            </form>
        </div>
        
        <footer>
            <p>&copy; 2024 Sistema Ojeador</p>
        </footer>
    </div>
</body>
</html>
