<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial de Equipos - Ojeador</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }
        
        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        header h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }
        
        .content {
            padding: 30px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
        }
        
        select {
            width: 100%;
            padding: 10px;
            border: 2px solid #e9ecef;
            border-radius: 5px;
            font-size: 1em;
        }
        
        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }
        
        button {
            flex: 1;
            padding: 12px 20px;
            font-size: 1em;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-volver {
            background: #f0f0f0;
            color: #333;
            text-decoration: none;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .btn-volver:hover {
            background: #e0e0e0;
        }
        
        .resultado {
            margin-top: 40px;
        }
        
        .resultado h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5em;
        }
        
        .jugador-info {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #667eea;
        }
        
        .jugador-info h3 {
            color: #667eea;
            margin-bottom: 10px;
        }
        
        .contratos-timeline {
            position: relative;
            padding: 20px 0;
        }
        
        .contrato-item {
            background: white;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            position: relative;
            transition: all 0.3s ease;
        }
        
        .contrato-item:hover {
            border-color: #667eea;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
        }
        
        .contrato-item::before {
            content: '';
            position: absolute;
            left: -25px;
            top: 25px;
            width: 15px;
            height: 15px;
            background: #667eea;
            border-radius: 50%;
            border: 3px solid white;
            box-shadow: 0 0 0 2px #667eea;
        }
        
        .contrato-header {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }
        
        .contrato-field {
            padding-bottom: 10px;
        }
        
        .contrato-field strong {
            color: #667eea;
            display: block;
            font-size: 0.85em;
            margin-bottom: 5px;
        }
        
        .contrato-field span {
            color: #333;
            font-size: 1em;
        }
        
        .no-resultados {
            text-align: center;
            padding: 40px;
            color: #666;
            background: #f8f9fa;
            border-radius: 8px;
        }
        
        footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            color: #666;
            border-top: 1px solid #e9ecef;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 Historial de Equipos por Jugador</h1>
        </header>
        
        <div class="content">
            <form method="post" action="/ojeador/historial-equipos">
                <div class="form-group">
                    <label for="jugadorId">Selecciona un Jugador</label>
                    <select id="jugadorId" name="jugadorId" required>
                        <option value="">-- Selecciona un jugador --</option>
                        <option th:each="jugador : ${jugadores}" th:value="${jugador.id}" th:text="${jugador.nombre}"></option>
                    </select>
                </div>
                
                <div class="buttons">
                    <button type="submit">Ver Historial</button>
                    <a href="/ojeador/" class="btn-volver">Volver</a>
                </div>
            </form>
            
            <div th:if="${jugador}" class="resultado">
                <h2>Historial de <span th:text="${jugador.nombre}"></span></h2>
                
                <div class="jugador-info">
                    <h3 th:text="${jugador.nombre}"></h3>
                    <p><strong>Posición:</strong> <span th:text="${jugador.posicion}"></span></p>
                    <p><strong>Dorsal Actual:</strong> <span th:text="${jugador.dorsal}"></span></p>
                    <p><strong>Equipo Actual:</strong> <span th:text="${jugador.equipo != null ? jugador.equipo.nombre : 'Sin equipo'}"></span></p>
                </div>
                
                <div th:if="${!jugador.contratos.isEmpty()}" class="contratos-timeline">
                    <h3 style="color: #333; margin-bottom: 20px;">Equipos donde ha jugado:</h3>
                    <div th:each="contrato : ${jugador.contratos}" class="contrato-item">
                        <div class="contrato-header">
                            <div class="contrato-field">
                                <strong>Equipo</strong>
                                <span th:text="${contrato.jugador != null ? contrato.jugador.equipo?.nombre : 'Información no disponible'}"></span>
                            </div>
                            <div class="contrato-field">
                                <strong>Fecha Inicio</strong>
                                <span th:text="${contrato.fechaInicio}"></span>
                            </div>
                            <div class="contrato-field">
                                <strong>Fecha Fin</strong>
                                <span th:text="${contrato.fechaFin}"></span>
                            </div>
                            <div class="contrato-field">
                                <strong>Salario</strong>
                                <span>€<span th:text="${#numbers.formatDecimal(contrato.salario, 0, 'COMMA', 2, 'POINT')}"></span></span>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div th:if="${jugador.contratos.isEmpty()}" class="no-resultados">
                    <p>Este jugador no tiene contratos registrados</p>
                </div>
            </div>
        </div>
        
        <footer>
            <p>&copy; 2024 Sistema Ojeador</p>
        </footer>
    </div>
</body>
</html>
