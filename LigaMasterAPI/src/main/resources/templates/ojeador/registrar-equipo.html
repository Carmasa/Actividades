<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Equipo - Ojeador</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }
        
        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        header h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }
        
        .content {
            padding: 30px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
        }
        
        input[type="text"],
        input[type="number"],
        select {
            width: 100%;
            padding: 10px;
            border: 2px solid #e9ecef;
            border-radius: 5px;
            font-size: 1em;
            transition: border-color 0.3s ease;
        }
        
        input[type="text"]:focus,
        input[type="number"]:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }
        
        button {
            flex: 1;
            padding: 12px 20px;
            font-size: 1em;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }
        
        .btn-registrar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-registrar:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-cancelar {
            background: #e9ecef;
            color: #333;
        }
        
        .btn-cancelar:hover {
            background: #dee2e6;
        }
        
        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            border-left: 4px solid #28a745;
        }
        
        footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            color: #666;
            border-top: 1px solid #e9ecef;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🏟️ Registrar Equipo</h1>
            <p>Añade un nuevo equipo a la base de datos</p>
        </header>
        
        <div class="content">
            <form th:action="@{/ojeador/registrar-equipo}" method="post">
                <div class="form-group">
                    <label for="nombre">Nombre del Equipo:</label>
                    <input type="text" id="nombre" name="nombre" required placeholder="Ej: Real Madrid">
                </div>
                
                <div class="form-group">
                    <label for="estadio">Estadio:</label>
                    <input type="text" id="estadio" name="estadio" required placeholder="Ej: Santiago Bernabéu">
                </div>
                
                <div class="form-group">
                    <label for="ciudad">Ciudad:</label>
                    <input type="text" id="ciudad" name="ciudad" required placeholder="Ej: Madrid">
                </div>
                
                <div class="buttons">
                    <button type="submit" class="btn-registrar">✅ Registrar Equipo</button>
                    <a href="/ojeador/" style="flex: 1; text-decoration: none;">
                        <button type="button" class="btn-cancelar" style="width: 100%;">❌ Cancelar</button>
                    </a>
                </div>
            </form>
        </div>
        
        <footer>
            <p>&copy; 2024 Sistema Ojeador - Gestión de Futbolistas</p>
        </footer>
    </div>
</body>
</html>
