<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jugador Más Caro - Ojeador</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }
        
        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        header h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }
        
        .content {
            padding: 30px;
        }
        
        .jugador-premium {
            background: linear-gradient(135deg, #ffd700 0%, #ffed4e 100%);
            border-radius: 10px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(255, 215, 0, 0.3);
            margin-bottom: 30px;
        }
        
        .jugador-premium h2 {
            color: #333;
            font-size: 2em;
            margin-bottom: 15px;
        }
        
        .jugador-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        
        .detail-item {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        
        .detail-item label {
            display: block;
            color: #666;
            font-size: 0.85em;
            font-weight: bold;
            margin-bottom: 8px;
        }
        
        .detail-item .value {
            color: #333;
            font-size: 1.3em;
            font-weight: bold;
        }
        
        .valor-mercado {
            color: #27ae60;
            font-size: 1.8em !important;
        }
        
        .no-jugadores {
            text-align: center;
            padding: 40px;
            color: #666;
            background: #f8f9fa;
            border-radius: 8px;
        }
        
        .btn-volver {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 30px;
            background: #f0f0f0;
            color: #333;
            text-decoration: none;
            border-radius: 5px;
            transition: all 0.3s ease;
            font-weight: bold;
        }
        
        .btn-volver:hover {
            background: #e0e0e0;
            transform: translateY(-2px);
        }
        
        footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            color: #666;
            border-top: 1px solid #e9ecef;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>💰 Jugador Más Caro de la Liga</h1>
        </header>
        
        <div class="content">
            <div th:if="${jugador}" class="jugador-premium">
                <h2>⭐ <span th:text="${jugador.nombre}"></span></h2>
                
                <div class="jugador-details">
                    <div class="detail-item">
                        <label>Posición</label>
                        <div class="value" th:text="${jugador.posicion}"></div>
                    </div>
                    
                    <div class="detail-item">
                        <label>Dorsal</label>
                        <div class="value" th:text="${jugador.dorsal}"></div>
                    </div>
                    
                    <div class="detail-item">
                        <label>Equipo</label>
                        <div class="value" th:text="${jugador.equipo != null ? jugador.equipo.nombre : 'Sin equipo'}"></div>
                    </div>
                    
                    <div class="detail-item">
                        <label>Valor de Mercado</label>
                        <div class="value valor-mercado">€<span th:text="${#numbers.formatDecimal(jugador.valorMercado, 0, 'COMMA', 2, 'POINT')}"></span></div>
                    </div>
                </div>
            </div>
            
            <div th:unless="${jugador}" class="no-jugadores">
                <p>No hay jugadores registrados en la base de datos</p>
            </div>
            
            <a href="/ojeador/" class="btn-volver">⬅ Volver al Menú Principal</a>
        </div>
        
        <footer>
            <p>&copy; 2024 Sistema Ojeador</p>
        </footer>
    </div>
</body>
</html>
