<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>SaaS Core - Facturación</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --sidebar-w: 260px;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: var(--sidebar-w);
            background: #ffffff;
            border-right: 1px solid var(--border);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
        }

        .logo {
            font-weight: 800;
            font-size: 1.25rem;
            color: var(--primary);
            margin-bottom: 2.5rem;
            text-decoration: none;
        }

        .nav-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            flex: 1;
        }

        .nav-item {
            display: flex;
            align-items: center;
            padding: 0.75rem 1rem;
            text-decoration: none;
            color: var(--text-muted);
            font-weight: 500;
            border-radius: 0.5rem;
            transition: all 0.2s;
        }

        .nav-item:hover,
        .nav-item.active {
            background: #f1f5f9;
            color: var(--primary);
        }

        .main-content {
            margin-left: var(--sidebar-w);
            flex: 1;
            padding: 2.5rem;
        }

        header {
            margin-bottom: 2.5rem;
        }

        h1 {
            font-size: 1.875rem;
            font-weight: 700;
            margin: 0;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 1rem;
            padding: 1.5rem;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            padding: 0.75rem;
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border);
        }

        td {
            padding: 1rem 0.75rem;
            border-bottom: 1px solid var(--border);
            font-size: 0.875rem;
        }

        .btn {
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            font-size: 0.8125rem;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid var(--border);
            background: white;
            color: var(--text);
            text-decoration: none;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            border: none;
        }
    </style>
</head>

<body>
    <div class="sidebar">
        <a href="/" class="logo">SaaS Core</a>
        <nav class="nav-group">
            <a href="/" class="nav-item">Dashboard</a>
            <a href="/billing" class="nav-item active">Facturación</a>
            <a href="/admin/audit" class="nav-item" sec:authorize="hasRole('ADMIN')">Auditoría</a>
        </nav>
    </div>

    <div class="main-content">
        <header>
            <h1>Historial de Facturación</h1>
        </header>

        <div class="card">
            <form th:action="@{/billing}" method="get"
                style="margin-bottom: 2rem; display: flex; gap: 1rem; align-items: center;">
                <label style="font-size: 0.875rem; font-weight: 500;">Filtrar por monto mínimo:</label>
                <input type="number" name="minMonto" step="0.01" placeholder="0.00"
                    style="padding: 0.5rem; border: 1px solid var(--border); border-radius: 0.5rem;">
                <button type="submit" class="btn btn-primary">Filtrar</button>
            </form>

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Fecha</th>
                        <th>Concepto</th>
                        <th>Monto Total</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="f : ${facturas}">
                        <td th:text="${f.id}"></td>
                        <td th:text="${f.fechaEmision}"></td>
                        <td th:text="${f.concepto}"></td>
                        <td><strong th:text="${f.monto + ' €'}"></strong></td>
                        <td><span
                                style="color: #166534; background: #dcfce7; padding: 0.25rem 0.5rem; border-radius: 0.25rem; font-size: 0.75rem; font-weight: 600;">PAGADA</span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>

</html>
