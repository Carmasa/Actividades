<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Facturación</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container mt-5">
        <h1>Facturas Generadas</h1>
        <a href="/" class="btn btn-secondary mb-3">Volver</a>

        <form action="/billing" method="get" class="mb-4">
            <label for="minAmount">Filtrar por monto mínimo:</label>
            <input type="number" step="0.01" name="minAmount" id="minAmount" class="form-control d-inline-block w-auto">
            <button type="submit" class="btn btn-primary">Filtrar</button>
        </form>

        <table class="table table-striped">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Suscripción</th>
                    <th>Fecha</th>
                    <th>Concepto</th>
                    <th>Monto Total (Inc. Impuestos)</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="factura : ${facturas}">
                    <td th:text="${factura.id}">1</td>
                    <td th:text="${factura.suscripcion.id}">101</td>
                    <td th:text="${factura.fechaEmision}">2023-01-01</td>
                    <td th:text="${factura.concepto}">Concepto</td>
                    <td th:text="${factura.monto} + ' €'">12.10 €</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>

</html>
