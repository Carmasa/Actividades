<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>SaaS Core - Auditoría</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --sidebar-w: 260px;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: var(--sidebar-w);
            background: #ffffff;
            border-right: 1px solid var(--border);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
        }

        .logo {
            font-weight: 800;
            font-size: 1.25rem;
            color: var(--primary);
            margin-bottom: 2.5rem;
            text-decoration: none;
        }

        .nav-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            flex: 1;
        }

        .nav-item {
            display: flex;
            align-items: center;
            padding: 0.75rem 1rem;
            text-decoration: none;
            color: var(--text-muted);
            font-weight: 500;
            border-radius: 0.5rem;
            transition: all 0.2s;
        }

        .nav-item:hover,
        .nav-item.active {
            background: #f1f5f9;
            color: var(--primary);
        }

        .main-content {
            margin-left: var(--sidebar-w);
            flex: 1;
            padding: 2.5rem;
        }

        header {
            margin-bottom: 2.5rem;
        }

        h1 {
            font-size: 1.875rem;
            font-weight: 700;
            margin: 0;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 1rem;
            padding: 1.5rem;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            padding: 0.75rem;
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border);
        }

        td {
            padding: 1rem 0.75rem;
            border-bottom: 1px solid var(--border);
            font-size: 0.875rem;
        }

        .type {
            font-size: 0.75rem;
            font-weight: 700;
            padding: 0.2rem 0.5rem;
            border-radius: 0.25rem;
        }
    </style>
</head>

<body>
    <div class="sidebar">
        <a href="/" class="logo">SaaS Core</a>
        <nav class="nav-group">
            <a href="/" class="nav-item">Dashboard</a>
            <a href="/billing" class="nav-item">Facturación</a>
            <a href="/admin/audit" class="nav-item active" sec:authorize="hasRole('ADMIN')">Auditoría</a>
        </nav>
    </div>

    <div class="main-content">
        <header>
            <h1>Registro de Auditoría</h1>
        </header>

        <div class="card">
            <table>
                <thead>
                    <tr>
                        <th>Rev ID</th>
                        <th>Tipo Operación</th>
                        <th>ID Suscripción</th>
                        <th>Cambios/Datos</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="entry : ${auditLog}">
                        <td th:text="${entry.revId}"></td>
                        <td>
                            <span class="type"
                                th:style="${entry.revType == 'ADD' ? 'color: #166534; background: #dcfce7;' : (entry.revType == 'MOD' ? 'color: #92400e; background: #fef3c7;' : 'color: #991b1b; background: #fee2e2;')}"
                                th:text="${entry.revType}"></span>
                        </td>
                        <td th:text="${entry.id}"></td>
                        <td th:text="${entry.toString()}"></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>

</html>
